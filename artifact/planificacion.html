<title>Planificación Delaire 2000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: tablero de taller — panel de fichas a la izquierda, tarjetas de trabajo en rejilla; vista TV oscura a pantalla completa. */
:root {
  --bg: #edf1f5; --surface: #ffffff; --surface-2: #f4f6f9; --line: #d3dbe4; --ink: #14202c; --muted: #586979;
  --brand: #133b5f; --brand-ink: #ffffff; --accent: #1f6fb2; --accent-ink: #ffffff; --focus: #4d9be0;
  --ok: #1b7a3a; --ok-bg: #e2f3e7; --ok-line: #b3dcbf;
  --warn: #8f5300; --warn-bg: #fff0d4; --warn-line: #efcd8c;
  --bad: #b02a20; --bad-bg: #fde3e0; --bad-line: #f0b7b1;
  --info: #1d5c9e; --info-bg: #e1edfa; --info-line: #b5d0ef;
  --mute-bg: #e9edf1; --mute-line: #cdd5dd;
  --abs: #6a2a8c; --abs-bg: #f2e6f7; --abs-line: #d9bde6;
  --chip-line: rgba(20, 35, 60, .45); --shadow: 0 1px 2px rgba(16, 30, 50, .06), 0 2px 6px rgba(16, 30, 50, .06);
  --tv-bg: #0c1824; --tv-card: #15283a; --tv-ink: #eef4f9; --tv-muted: #a9bccd; --tv-time: #9fd0ff;
  --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-display: "Barlow Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e151c; --surface: #16202b; --surface-2: #1c2834; --line: #2c3a48; --ink: #e5ecf3; --muted: #95a6b7;
    --brand: #0b2236; --brand-ink: #ffffff; --accent: #5aa6ec; --accent-ink: #08131e; --focus: #7cb9f0;
    --ok: #6fd18f; --ok-bg: #133222; --ok-line: #24573a;
    --warn: #f3b955; --warn-bg: #3a2a0d; --warn-line: #6a4c14;
    --bad: #ff8a80; --bad-bg: #3d1916; --bad-line: #6d2a24;
    --info: #8cc0f2; --info-bg: #13283f; --info-line: #24476b;
    --mute-bg: #222e3a; --mute-line: #33424f;
    --abs: #d7a6ee; --abs-bg: #2e1b38; --abs-line: #503262;
    --chip-line: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e151c; --surface: #16202b; --surface-2: #1c2834; --line: #2c3a48; --ink: #e5ecf3; --muted: #95a6b7;
  --brand: #0b2236; --brand-ink: #ffffff; --accent: #5aa6ec; --accent-ink: #08131e; --focus: #7cb9f0;
  --ok: #6fd18f; --ok-bg: #133222; --ok-line: #24573a;
  --warn: #f3b955; --warn-bg: #3a2a0d; --warn-line: #6a4c14;
  --bad: #ff8a80; --bad-bg: #3d1916; --bad-line: #6d2a24;
  --info: #8cc0f2; --info-bg: #13283f; --info-line: #24476b;
  --mute-bg: #222e3a; --mute-line: #33424f;
  --abs: #d7a6ee; --abs-bg: #2e1b38; --abs-line: #503262;
  --chip-line: rgba(0, 0, 0, .55); --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap; font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .chip:focus-visible, .linkish:focus-visible, .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn-ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); font-weight: 700; }
.btn-small { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn-icon { width: 40px; padding: 0; font-size: 20px; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--brand); color: var(--brand-ink); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; }
.mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; background: var(--brand-ink); color: var(--brand); font: 800 18px/1 var(--font-display); letter-spacing: .02em; }
.brand-name { font: 700 19px/1.05 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.brand-name small { display: block; font: 500 12px/1.2 var(--font-body); text-transform: none; letter-spacing: 0; opacity: .8; }
.datenav { display: flex; align-items: center; gap: 6px; }
.top .btn { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); color: var(--brand-ink); }
.top .btn:hover { background: rgba(255, 255, 255, .2); }
.date-btn { min-height: 40px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: var(--brand-ink); cursor: pointer;
  font: 700 21px/1 var(--font-display); letter-spacing: .01em; position: relative; }
.date-btn:hover { background: rgba(255, 255, 255, .1); }
.date-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.sync { display: flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #6ee08f; flex: none; }
.dot.err { background: #ff8a80; } .dot.busy { background: #ffd54f; }
.tabs { display: flex; gap: 4px; background: rgba(255, 255, 255, .1); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; color: var(--brand-ink); padding: 0 12px; min-height: 34px; border-radius: 7px; cursor: pointer; font-weight: 600; }
.tab[aria-current="page"] { background: var(--brand-ink); color: var(--brand); }

/* Avisos */
.notices { display: grid; gap: 8px; padding-block: 10px 0; }
.notices:empty { display: none; }
.notice { padding: 10px 14px; border-radius: 10px; border: 1px solid; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.notice.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--ink); }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--ink); }
.notice.info { background: var(--info-bg); border-color: var(--info-line); color: var(--ink); }
.notice strong { font-weight: 700; }

/* Vistas */
.view { display: none; }
body[data-view="board"] #v-board { display: grid; }
body[data-view="tv"] #v-tv { display: flex; }
body[data-view="settings"] #v-settings { display: block; }
body.ro .ed { display: none !important; }

/* Tablero */
#v-board { grid-template-columns: 300px minmax(0, 1fr); gap: 16px; padding-block: 16px 40px; align-items: start; }
.panel { position: sticky; top: 84px; max-height: calc(100dvh - 100px); overflow: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px; box-shadow: var(--shadow); }
.panel h3 { font: 700 13px/1 var(--font-display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 16px 0 8px; }
.panel .hint { margin: 0; font-size: 13px; color: var(--muted); }
.sheet-btn { display: none; }
.drop-out { display: none; }
body.dragging .panel .drop-out { display: block; position: sticky; bottom: 0; margin-top: 10px; padding: 14px; text-align: center; border: 2px dashed var(--bad);
  border-radius: 10px; background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.panel.over .drop-out { background: var(--bad); color: var(--surface); }
.legend { margin-top: 14px; font-size: 13px; }
.legend summary { cursor: pointer; color: var(--muted); }
.legend ul { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 4px; }
.sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--chip-line); vertical-align: -3px; margin-right: 6px; }
.sw.pend { border-style: dashed; }

/* Fichas */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 3px;
  background: var(--cb); color: var(--cf); border: 1px solid var(--chip-line); font: 700 15px/1 var(--font-display); letter-spacing: .04em;
  white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px); }
.chip[data-drag] { cursor: grab; touch-action: manipulation; }
.chip.pend { border: 2px dashed #4f5f6f; clip-path: none; border-radius: 8px; }
.chip.sel { clip-path: none; border-radius: 8px; outline: 3px solid var(--accent); outline-offset: 2px; }
.chip.off { opacity: .45; }
.chip.abs { text-decoration: line-through; text-decoration-thickness: 2px; }
.chip.confl { box-shadow: inset 0 0 0 3px #c62828; }
.chip .flag { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: #14202c; color: #fff; font: 700 11px/1 var(--font-body); }
.chip .flag.w { background: #c62828; }
.chip .n { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: rgba(0, 0, 0, .72); color: #fff; font: 700 11px/1 var(--font-body); }
.chip .x { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-right: -6px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(0, 0, 0, .15); color: inherit; font: 400 19px/1 var(--font-body); cursor: pointer; }
.chip .x:hover { background: rgba(0, 0, 0, .3); }
.chip.van { clip-path: polygon(13px 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 13px 100%, 0 50%); padding: 0 19px; border: 0; }
.chip.van.pend { clip-path: none; border: 2px dashed #4f5f6f; }
.chip .typ { font: 600 11px/1 var(--font-body); text-transform: uppercase; opacity: .78; letter-spacing: .03em; }
.chip.big { min-height: 46px; font-size: 21px; padding: 0 16px; }
.chip.van.big { padding: 0 24px; }
.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; clip-path: none !important; border-radius: 8px; box-shadow: 0 12px 26px rgba(0, 0, 0, .3); }
.src { opacity: .35; }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* Trabajos */
.jobs { min-width: 0; display: grid; gap: 12px; align-content: start; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-variant-numeric: tabular-nums; }
.pill b { font-weight: 700; }
.pill.zero { opacity: .5; }
.pill.st-un { background: var(--mute-bg); border-color: var(--mute-line); }
.pill.st-nd { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.pill.st-cf { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.pill.st-ok { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }
.internal { margin: 0; font-size: 13px; color: var(--muted); }
.sec { font: 700 14px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
.empty { padding: 36px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }

.job { display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; box-shadow: var(--shadow); position: relative; }
.job::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 5px; border-radius: 0 4px 4px 0; background: var(--mute-line); }
.job.s-sin-conductor::before { background: #e08a00; }
.job.s-asignado::before { background: #2e9d52; }
.job.s-conflicto::before { background: #d32f2f; }
.job.done { background: linear-gradient(var(--ok-bg), var(--ok-bg)) top / 100% 3px no-repeat, var(--surface); }
.job.over { box-shadow: 0 0 0 3px var(--accent), var(--shadow); }
.job.over.warn { box-shadow: 0 0 0 3px #d32f2f, var(--shadow); }
.job-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.time { font: 800 24px/1 var(--font-display); color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.job h4 { margin: 0; font: 600 16px/1.3 var(--font-body); overflow-wrap: anywhere; }
.linkish { all: unset; cursor: pointer; }
.linkish:hover { text-decoration: underline; }
.loc { font-weight: 600; font-size: 14px; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
a.loc:hover { text-decoration: underline; }
.loc.none { font-weight: 400; color: var(--muted); }
.slot { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 8px; padding: 8px; }
.slot-l { font: 700 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.slot-l .w { color: var(--warn); text-transform: none; letter-spacing: 0; font: 600 12px/1 var(--font-body); }
.drop-hint { font-size: 13px; font-style: italic; color: var(--muted); min-height: 34px; display: inline-flex; align-items: center; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.b { padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; border: 1px solid; }
.b-sin-asignar { background: var(--mute-bg); border-color: var(--mute-line); color: var(--ink); }
.b-sin-conductor { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.b-asignado { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.b-conflicto { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.b-ausencia { background: var(--abs-bg); border-color: var(--abs-line); color: var(--abs); }
.b-completo { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }
.confl { margin: 0; padding: 8px 10px 8px 26px; background: var(--bad-bg); border-radius: 8px; font-size: 13px; color: var(--ink); }
.hints { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 10px; background: var(--info-bg); border-radius: 8px; font-size: 13px; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.here { flex-basis: 100%; min-height: 46px; font-weight: 700; }
.job.compact { gap: 6px; }
.job.compact .time { font-size: 17px; }
.orph { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }

.selbar { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: calc(100% - 24px); background: var(--surface); border: 2px solid var(--accent);
  border-radius: 14px; padding: 8px 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 24px);
  display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 10px; background: var(--ink); color: var(--bg); box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.toast.warn { background: var(--warn); color: var(--surface); }
.toast.bad { background: var(--bad); color: var(--surface); }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 4px 10px; cursor: pointer; }

/* Diálogos (los propios del navegador no funcionan dentro del artefacto) */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(680px, calc(100% - 24px)); max-height: calc(100dvh - 24px); background: var(--surface); color: var(--ink);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .35); }
dialog.sm { width: min(480px, calc(100% - 24px)); }
dialog::backdrop { background: rgba(8, 16, 26, .55); }
.dlg { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.dlg h2 { margin: 0; font: 700 22px/1.15 var(--font-display); text-wrap: balance; }
.dlg p { margin: 0; }
.dlg-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.close { border: 0; background: var(--surface-2); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 22px; cursor: pointer; flex: none; }
.dlg-acts { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.dlg-acts.stick { position: sticky; bottom: -18px; background: var(--surface); padding: 10px 0 4px; border-top: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 8px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
dl { margin: 0; display: grid; gap: 6px; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: 42vh; overflow: auto; }
fieldset { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin: 0; }
legend { font-weight: 700; padding: 0 4px; }
.pick { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 5px 4px; border-radius: 8px; cursor: pointer; }
.pick:hover { background: var(--surface-2); }
.pick input { width: 22px; height: 22px; flex: none; }
.pw { font-size: 12px; font-weight: 600; color: var(--bad); }
.pi { font-size: 12px; color: var(--muted); }
.pst { font-weight: 600; } .pst.w { color: var(--warn); }

/* Ajustes */
#v-settings { padding-block: 16px 40px; max-width: 1100px; margin: 0 auto; }
#v-settings h1 { font: 700 28px/1.1 var(--font-display); margin: 4px 0 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
.card h2 { font: 700 20px/1.1 var(--font-display); margin: 0 0 8px; }
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font: 700 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
td input[type="text"], td select { min-height: 36px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); width: 100%; min-width: 110px; }
td input[type="checkbox"] { width: 22px; height: 22px; }
td input[type="color"] { width: 48px; height: 36px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--surface); }
tr.off td { opacity: .55; }
tr.new td { background: var(--surface-2); }

/* Pantalla TV — aspecto oscuro deliberado en ambos temas */
#v-tv { flex-direction: column; gap: 14px; min-height: 100dvh; padding-block: 18px; background: var(--tv-bg); color: var(--tv-ink); }
body[data-view="tv"] { background: var(--tv-bg); }
body[data-view="tv"] .top, body[data-view="tv"] #notices { display: none; }
.tv-head { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; }
.tv-date { font: 800 clamp(30px, 3.4vw, 58px)/1 var(--font-display); letter-spacing: .01em; text-wrap: balance; }
.tv-sum { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font: 600 clamp(16px, 1.5vw, 24px)/1.2 var(--font-body); }
.tv-sum span { padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, .1); }
.tv-sum .un { background: #3a4a5c; } .tv-sum .nd { background: #ffb020; color: #1b1300; } .tv-sum .cf { background: #ff5a50; color: #fff; }
.tv-r { text-align: right; }
.tv-clock { font: 800 clamp(40px, 4.6vw, 76px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.tv-sync { color: var(--tv-muted); font-size: 15px; margin-top: 4px; }
.tv-ctrl { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; transition: opacity .3s; }
.tv-ctrl .btn { background: rgba(255, 255, 255, .1); color: var(--tv-ink); border-color: rgba(255, 255, 255, .25); }

<script>
(() => {
'use strict';
// ===== Configuración =====
const SERVER = 'Microsoft 365';                 // conector de claude.ai (solo se usan herramientas de LECTURA)
const CAL_OWNER = 'info@delaire-2000.com';      // calendario compartido de la empresa
const TZ = 'Europe/Madrid';
const POLL_MS = 60000;

// ===== Utilidades =====
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;

    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k === 'style') for (const [p, val] of Object.entries(v)) el.style.setProperty(p, val);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);

  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const $ = (s) => document.querySelector(s);
const fill = (el, ...kids) => el.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));
const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/\s+/g, ' ').trim();
const escRe = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

const dfDay = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const dfLong = new Intl.DateTimeFormat('es-ES', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dfClock = new Intl.DateTimeFormat('es-ES', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const dfStamp = new Intl.DateTimeFormat('es-ES', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const todayStr = () => dfDay.format(new Date());
const dObj = (d) => new Date(d + 'T12:00:00Z');
const addDays = (d, n) => { const x = dObj(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const longDate = (d) => { const s = dfLong.format(dObj(d)); return s[0].toUpperCase() + s.slice(1); };
function rel(ms) {
  if (!ms) return 'sin datos';
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 15) return 'ahora mismo';
  if (s < 60) return `hace ${s} s`;
  if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  return dfStamp.format(ms);
}
const mapsUrl = (q) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);

// Hora "de pared" de Outlook -> "YYYY-MM-DDTHH:MM" en hora de Madrid.
function wall(dt) {
  if (!dt || !dt.dateTime) return null;
  const s = String(dt.dateTime);
  if (/utc|coordinated/i.test(dt.timeZone || '') || /Z$/.test(s)) {
    const ms = Date.parse(s.replace(/(\.\d{3})\d*/, '$1').replace(/Z?$/, 'Z'));
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      .formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
  }

}
const wallMs = (w) => Date.UTC(+w.slice(0, 4), +w.slice(5, 7) - 1, +w.slice(8, 10), +w.slice(11, 13), +w.slice(14, 16));
const hhmm = (w) => w.slice(11, 16);

// Claves válidas para la base de datos a partir del id de Outlook.
const keyOf = (id) => String(id).replace(/=/g, '~').replace(/\//g, '.').replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 190);

// ===== Reglas de planificación =====
const overlaps = (a, b) => a.span[0] < b.span[1] && b.span[0] < a.span[1];
function conflictsFor(type, id, eventId, events, plans) {
  const t = events.find((e) => e.id === eventId);
  if (!t) return [];
  const k = type === 'tech' ? 'techs' : 'vans';
  return events.filter((e) => e.id !== eventId && plans[e.id]?.[k]?.includes(id) && overlaps(e, t));
}
function detectAbsences(events, techs) {
  const out = {};
  const byLen = [...techs].sort((a, b) => b.name.length - a.name.length);
  for (const e of events) {
    let t = norm(e.title);
    if (!/\b(VACACIONES|AUSENCIA|BAJA|MEDICO|PERMISO|DIA LIBRE|ASUNTOS PROPIOS)\b/.test(t)) continue;
    for (const tech of byLen) {
      const re = new RegExp(`\\b${escRe(norm(tech.name))}\\w*`);
      if (re.test(t)) { (out[tech.id] ||= []).push(e.id); t = t.replace(re, ' '); }
    }
  }
  return out;
}
function titleHints(title, techs, vans) {
  const t = norm(title);
  const names = techs.map((x) => ({ id: x.id, n: norm(x.name), multi: norm(x.name).includes(' ') }));
  const found = new Set();
  for (const seg of t.split('|')) {
    const toks = seg.split(/\s*(?:\+|,|\/|&|\bY\b)\s*/).map((x) => x.trim()).filter(Boolean);
    if (!toks.length) continue;
    const ids = [];
    let all = true;
    for (const tok of toks) {
      const m = names.find((n) => n.n === tok) || names.find((n) => n.multi && tok.startsWith(n.n));
      if (m) ids.push(m.id); else { all = false; break; }
    }
    if (all) ids.forEach((i) => found.add(i));
  }
  const compact = t.replace(/[\s-]/g, '');
  return { techs: [...found], vans: vans.filter((v) => v.plate && compact.includes(norm(v.plate).replace(/[\s-]/g, ''))).map((v) => v.id) };
}
function computeDay() {
  const { events } = S.day; const plans = S.plans;
  const techs = S.res.techs;
  const byId = Object.fromEntries(techs.map((t) => [t.id, t]));
  const absences = detectAbsences(events, techs);
  const use = { tech: {}, van: {} };
  for (const e of events) {
    const p = plans[e.id]; if (!p) continue;
    p.techs.forEach((i) => (use.tech[i] ||= []).push(e.id));
    p.vans.forEach((i) => (use.van[i] ||= []).push(e.id));
  }
  const jobs = {};
  for (const e of events) {
    const p = plans[e.id] || { techs: [], vans: [], completed: false };
    const conflicts = [];
    for (const [type, k] of [['tech', 'techs'], ['van', 'vans']]) for (const i of p[k]) {
      const w = conflictsFor(type, i, e.id, events, plans).map((o) => o.id);
      if (w.length) conflicts.push({ type, id: i, with: w });
    }
    const hasDriver = p.techs.some((i) => byId[i]?.license);
    const absent = p.techs.filter((i) => absences[i] && !absences[i].includes(e.id));
    const st = [];
    st.push(!p.techs.length ? 'sin-asignar' : hasDriver ? 'asignado' : 'sin-conductor');
    if (conflicts.length) st.push('conflicto');
    if (absent.length) st.push('ausencia');
    if (p.completed) st.push('completo');
    jobs[e.id] = { techs: p.techs, vans: p.vans, completed: !!p.completed, hasDriver, conflicts, absent, status: st };
  }
  const J = Object.values(jobs);
  S.calc = { jobs, use, absences, sum: {
    total: events.length, un: J.filter((j) => j.status.includes('sin-asignar')).length,
    nd: J.filter((j) => j.status.includes('sin-conductor')).length, cf: J.filter((j) => j.status.includes('conflicto')).length,
    ok: J.filter((j) => j.completed).length } };
}

// ===== Estado =====
const S = {
  date: todayStr(), view: 'board',
  res: { profiles: [], techs: [], vanTypes: [], vans: [] }, resLoaded: false, resVersion: null,
  day: { events: [], syncedAt: null, error: null, loading: true },
  plans: {}, planDocs: {}, calc: null, selected: null,
  canWrite: true, mcp: null, db: null, user: null, booting: true,
};
const tech = (id) => S.res.techs.find((t) => t.id === id);
const van = (id) => S.res.vans.find((v) => v.id === id);
const prof = (id) => S.res.profiles.find((p) => p.id === id);
const vtype = (id) => S.res.vanTypes.find((p) => p.id === id);
const ev = (id) => S.day.events.find((e) => e.id === id);
const planOf = (id) => S.plans[id] || { techs: [], vans: [], completed: false };
const editable = () => S.canWrite && !!S.db && S.resLoaded;
const vanLabel = (v) => `${String(v.model).toUpperCase()} ${v.plate}`;
const timeLabel = (e) => e.allDay ? (e.multiDay ? 'Todo el día · varios días' : 'Todo el día') : `${e.cutStart ? '← ' : ''}${hhmm(e.start)} – ${hhmm(e.end)}${e.cutEnd ? ' →' : ''}`;
const shortTime = (e) => e.allDay ? 'todo el día' : `${hhmm(e.start)}–${hhmm(e.end)}`;

// ===== Calendario (Outlook, solo lectura, con la conexión Microsoft 365 de quien mira) =====
function jsonValues(text) {
  try { return [JSON.parse(text)]; } catch { /* varios objetos seguidos */ }
  const out = []; let depth = 0, start = -1, inStr = false, esc = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inStr) { if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === '{' || c === '[') { if (!depth) start = i; depth++; }
    else if (c === '}' || c === ']') { depth--; if (!depth && start >= 0) { try { out.push(JSON.parse(text.slice(start, i + 1))); } catch {} start = -1; } }
  }
  return out;
}
function collect(res) {
  const out = [];
  const push = (v) => {
    if (Array.isArray(v)) return v.forEach(push);
    if (!v || typeof v !== 'object') return;
    for (const k of ['events', 'value', 'items', 'results']) if (Array.isArray(v[k])) return v[k].forEach(push);
    out.push(v);
  };
  if (res.structuredContent) push(res.structuredContent);
  else for (const b of res.content || []) if (b.type === 'text') jsonValues(b.text).forEach(push);
  if (!out.length && res.payload) push(res.payload);
  return out;
}
function normalizeEvent(o, date) {
  const s = wall(o.start), f = wall(o.end);
  if (!s || !f) return null;
  const allDay = !!o.isAllDay;
  const day0 = Date.UTC(+date.slice(0, 4), +date.slice(5, 7) - 1, +date.slice(8, 10));
  let span;
  const startDate = s.slice(0, 10), endDate = f.slice(0, 10);
  if (allDay) {
    const end = endDate > startDate ? endDate : addDays(startDate, 1);
    if (!(startDate <= date && date < end)) return null;
    span = [0, 1440];
  } else {
    const a = (wallMs(s) - day0) / 60000, b = (wallMs(f) - day0) / 60000;
    if (b <= 0 && !(a === b && a === 0)) return null;
    if (a >= 1440) return null;
    span = [Math.max(0, a), Math.min(1440, Math.max(b, a + 1))];
  }
  const loc = typeof o.location === 'string' ? o.location : (o.location?.displayName || '');
  return {
    id: String(o.id), title: (o.subject || '').trim() || '(Sin título)', preview: o.summary || o.bodyPreview || '',
    location: loc || '', allDay, start: s, end: f, startDate, endDate, span,
    multiDay: allDay ? (endDate > addDays(startDate, 1)) : (startDate !== endDate),
    cutStart: !allDay && s.slice(0, 10) < date, cutEnd: !allDay && f.slice(0, 10) > date && f.slice(11, 16) !== '00:00',
    categories: o.categories || [], link: o.webLink || '', uri: o.uri || `calendar:///events/${encodeURIComponent(o.id)}?owner=${encodeURIComponent(CAL_OWNER)}`,
    organizer: typeof o.organizer === 'string' ? o.organizer : (o.organizer?.name || o.organizer?.emailAddress?.name || ''),
  };
}
async function fetchDay(date, fresh) {
  const all = new Map(); let offset = 0; let storedAt = null;
  for (let page = 0; page < 10; page++) {
    const res = await S.mcp.callTool(SERVER, 'outlook_calendar_search', {
      query: '*', calendarOwnerEmail: CAL_OWNER,
      afterDateTime: addDays(date, -1) + 'T12:00:00', beforeDateTime: addDays(date, 1) + 'T12:00:00',
      limit: 25, offset, order: 'oldest',
    }, { cache: fresh ? { refresh: true, staleTime: 0, gcTime: 600000 } : { staleTime: 30000, gcTime: 600000 } });
    if (res.cache && res.cache.storedAt) storedAt = Math.min(storedAt ?? Infinity, res.cache.storedAt);
    const objs = collect(res);
    let next = null, n = 0;
    for (const o of objs) {
      if (o.nextOffset != null) next = o.nextOffset;
      if (o.id && (o.subject !== undefined || o.start)) { n++; if (!o.isCancelled) { const e = normalizeEvent(o, date); if (e) all.set(e.id, e); } }
    }
    if (next == null || !n || next <= offset) break;
    offset = next;
  }
  const events = [...all.values()].sort((a, b) => (a.allDay === b.allDay ? 0 : a.allDay ? -1 : 1) || a.span[0] - b.span[0] || a.span[1] - b.span[1] || a.title.localeCompare(b.title, 'es'));
  return { events, syncedAt: storedAt ?? Date.now() };
}

const CAL_ERR = {
  server_not_connected: 'Añade el conector Microsoft 365 en claude.ai → Ajustes → Conectores y vuelve a abrir esta página.',
  needs_reauth: 'La conexión con Microsoft 365 ha caducado. Vuelve a conectarla en claude.ai → Ajustes → Conectores.',
  selection_required: 'Tienes varias conexiones de Microsoft 365. Elige cuál usar en el aviso de claude.ai.',
  not_in_manifest: 'Has desactivado el acceso a Microsoft 365 para esta página. Actívalo en el menú Permisos del artefacto.',
  blocked_by_policy: 'La política de tu organización no permite leer el calendario desde esta página.',
  approval_required: 'Falta tu permiso para leer el calendario.',
  tool_error: 'Outlook no ha devuelto el calendario de info@. Comprueba que tu cuenta tiene acceso a ese calendario.',
  not_granted: 'Esta vista no puede usar conectores. Abre el artefacto en claude.ai con tu cuenta.',
  capability_disabled: 'Esta vista no puede usar conectores. Abre el artefacto en claude.ai con tu cuenta.',
};

let loadSeq = 0, retried = false;
async function loadDay(fresh = false) {
  if (S.booting) return;
  if (!S.mcp) { S.day = { events: [], syncedAt: null, loading: false, error: { code: 'no_mcp', message: 'Esta vista no puede leer el calendario. Abre el artefacto en claude.ai con tu cuenta de Delaire 2000.' } }; render(); return; }
  const seq = ++loadSeq; const date = S.date;
  S.day.loading = true; renderSync();
  try {
    const r = await fetchDay(date, fresh);
    if (seq !== loadSeq) return;
    S.day = { events: r.events, syncedAt: r.syncedAt, error: null, loading: false };
    retried = false;
  } catch (e) {
    if (seq !== loadSeq) return;
    if (e && e.retryable && !retried) {
      retried = true;
      setTimeout(() => loadDay(fresh), Math.min(e.retryAfterMs || 0, 60000) + 1500 + Math.random() * 2000);
      return;
    }

    const keep = S.day.events.length && S.day.date === date && !['needs_reauth', 'server_not_connected', 'blocked_by_policy', 'approval_required', 'not_in_manifest'].includes(code);
    S.day = { events: keep ? S.day.events : [], syncedAt: keep ? S.day.syncedAt : null, loading: false,
      error: { code, message: CAL_ERR[code] || `No se pudo leer el calendario (${e?.message || code}).`, detail: e?.message } };
  }
  S.day.date = date;

let unsubJobs = null;
function watchPlans() {
  unsubJobs?.(); unsubJobs = null;
  S.plans = {}; S.planDocs = {};
  if (!S.db) return;
  const date = S.date;
  unsubJobs = S.db.collection(`days/${date}/jobs`).onSnapshot((snap) => {
    if (date !== S.date) return;
    const plans = {}, docs = {};
    for (const d of snap.docs) {
      const x = d.data() || {};
      const id = x.eventId || d.id;
      plans[id] = { techs: (x.techs || []).map(Number), vans: (x.vans || []).map(Number), completed: !!x.completed };
      docs[id] = { key: d.id, title: x.title || '', start: x.start || '', end: x.end || '' };
    }

    computeDay(); render();

}
async function savePlan(eventId, plan) {
  const e = ev(eventId);
  const ref = S.db.doc(`days/${S.date}/jobs/${keyOf(eventId)}`);
  const prev = S.plans[eventId];
  const empty = !plan.techs.length && !plan.vans.length && !plan.completed;
  if (empty) delete S.plans[eventId]; else S.plans[eventId] = plan;
  computeDay(); render();
  try {
    if (empty) await ref.delete();
    else await ref.set({ eventId, techs: plan.techs, vans: plan.vans, completed: !!plan.completed,
      title: e?.title || S.planDocs[eventId]?.title || '', start: e?.start || '', end: e?.end || '', updatedAt: Date.now() });
    return true;
  } catch (err) {
    if (prev) S.plans[eventId] = prev; else delete S.plans[eventId];
    computeDay(); render();
    if (err.code === 'invalid_argument') { S.canWrite = false; render(); toast('Tu acceso a esta página es de solo lectura: no puedes cambiar la planificación.', 'bad'); }
    else toast('No se pudo guardar: ' + (err.message || err.code), 'bad');
    return false;
  }
}

async function assign(type, id, eventId, from = '') {
  if (!editable() || from === eventId) return false;
  const e = ev(eventId); if (!e) return false;
  const k = type === 'tech' ? 'techs' : 'vans';
  const p = planOf(eventId);
  if (p[k].includes(id)) { toast('Ya estaba en este trabajo.'); return false; }
  const r = type === 'tech' ? tech(id) : van(id);
  const name = type === 'tech' ? r.name : vanLabel(r);
  const lines = [];
  const plans = { ...S.plans };
  if (from && plans[from]) plans[from] = { ...plans[from], [k]: plans[from][k].filter((x) => x !== id) };
  const cf = conflictsFor(type, id, eventId, S.day.events, plans);
  cf.forEach((o) => lines.push(`⚠ Conflicto de horario: ${name} ya está en «${o.title}» (${shortTime(o)}).`));
  if (type === 'tech' && S.calc.absences[id]) lines.push(`⚠ Posible ausencia: el calendario dice «${S.calc.absences[id].map((x) => ev(x)?.title).join('», «')}».`);
  if (type === 'tech' && from && loseDriver(from, id)) lines.push(`⚠ «${ev(from)?.title || 'El trabajo de origen'}» se quedará sin nadie con carnet de conducir.`);
  let replace = false;

  if (from && S.plans[from]) {
    const src = { ...S.plans[from], [k]: S.plans[from][k].filter((x) => x !== id) };
    if (type === 'tech' && !src.techs.some((i) => tech(i)?.license)) src.completed = false;
    await savePlan(from, src);

function htmlText(html) {
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  doc.querySelectorAll('style,script,head').forEach((n) => n.remove());
  doc.querySelectorAll('br').forEach((n) => n.replaceWith('\n'));
  doc.querySelectorAll('p,div,li,tr,h1,h2,h3,h4').forEach((n) => n.append('\n'));
  return (doc.body?.textContent || '').replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

        if (t.dataset.dropEvent && conflictsFor(drag.data.type, drag.data.id, t.dataset.dropEvent, S.day.events, S.plans).length) t.classList.add('warn');
      }

  }
  function end(cancel) {
    clearInterval(scrollT);
    if (!drag) return;
    const { data, t, g, el } = drag; drag = null;
    g.remove(); el.classList.remove('src'); t?.classList.remove('over', 'warn'); document.body.classList.remove('dragging');
    suppress = true; setTimeout(() => (suppress = false), 60);
    if (cancel || !t) return;

  }
  document.addEventListener('pointerdown', (e) => {
    if (!editable() || S.view !== 'board' || e.button > 0) return;
    if (e.target.closest('.x, [data-nodrag]')) return;

  document.addEventListener('pointercancel', () => { if (pend) { clearTimeout(pend.timer); pend = null; } if (drag) end(true); });
  document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-drag]')) e.preventDefault(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (drag) end(true); else if (S.selected) { S.selected = null; render(); } } });
  document.addEventListener('click', (e) => { if (suppress) { e.preventDefault(); e.stopPropagation(); } }, true);
})();

// ===== Navegación =====
const VIEWS = { '': 'board', tablero: 'board', pantalla: 'tv', ajustes: 'settings' };
const HASH = { board: '', tv: 'pantalla', settings: 'ajustes' };
function go(view) {
  S.view = view; S.selected = null;
  try { history.replaceState(null, '', HASH[view] ? '#' + HASH[view] : location.pathname + location.search); } catch {}
  if (view === 'tv') wakeLock();
  render();
}
let lock = null;
async function wakeLock() { try { lock = await navigator.wakeLock?.request('screen'); } catch { lock = null; } }
function setDate(d) { if (!d || d === S.date) return; S.date = d; S.selected = null; S.day = { events: [], syncedAt: null, error: null, loading: true }; computeDay(); watchPlans(); render(); loadDay(); }
document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => go(b.dataset.go)));
$('#prev').addEventListener('click', () => setDate(addDays(S.date, -1)));
$('#next').addEventListener('click', () => setDate(addDays(S.date, 1)));
$('#today').addEventListener('click', () => setDate(todayStr()));
$('#date-input').addEventListener('change', (e) => setDate(e.target.value));
$('#refresh').addEventListener('click', () => { retried = false; loadDay(true); });
$('#sheet').addEventListener('click', () => document.body.classList.toggle('sheet'));
$('#tv-exit').addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {}); go('board'); });
$('#fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  else document.documentElement.requestFullscreen?.().catch(() => toast('Este navegador no permite pantalla completa aquí. Usa la tecla F11 o el modo de presentación de la TV.', 'warn'));
});
let idleT;
document.addEventListener('pointermove', () => { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 4000); });
addEventListener('hashchange', () => { const v = VIEWS[location.hash.slice(1)]; if (v && v !== S.view) go(v); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { loadDay(); if (S.view === 'tv') wakeLock(); } });
setInterval(() => {
  // A medianoche, si se estaba viendo "hoy", pasa al nuevo día.
  const t = todayStr();
  if (S.lastToday && S.lastToday !== t && S.date === S.lastToday) setDate(t);
  S.lastToday = t;
  if (!document.hidden) loadDay();
}, POLL_MS);
setInterval(renderSync, 15000);

// ===== Arranque =====
S.lastToday = todayStr();
S.view = VIEWS[location.hash.slice(1)] || 'board';
computeDay(); render();
(async () => {
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [mcp, db, user] = await Promise.all([use('mcp'), use('db'), use('user')]);
  S.booting = false;
  S.mcp = mcp; S.db = db; S.user = user;
  if (user) { try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch {} }
  if (db) {
    db.doc('config/resources').onSnapshot((snap) => {
      const x = snap.exists ? snap.data() : null;
      if (x) {
        S.res = { profiles: x.profiles || [], techs: (x.techs || []).map((t) => ({ ...t, id: Number(t.id) })), vanTypes: x.vanTypes || [], vans: (x.vans || []).map((v) => ({ ...v, id: Number(v.id) })) };
        S.resLoaded = true;
      }
      computeDay(); render();
    }, () => {});
    watchPlans();
  }
  render();
  loadDay();
})();
})();
</script>
