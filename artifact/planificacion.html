<title>Planificación Delaire 2000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: consola de despacho — barra superior clara, panel de recursos fijo a la izquierda y tarjetas de trabajo en rejilla;
   en móvil, cabecera compacta y recursos en hoja inferior. La vista TV es oscura en ambos temas. */
:root {
  --bg: #f1f4f7; --surface: #ffffff; --surface-2: #f6f8fa; --sunken: #ebeff3; --line: #e0e6ec; --line-2: #c9d3dd;
  --ink: #0f1a24; --ink-2: #3a4856; --muted: #66768a;
  --brand: #0e2a42; --brand-ink: #ffffff;
  --accent: #0b6f8a; --accent-strong: #08586e; --accent-soft: #e2f2f6; --accent-ink: #ffffff; --focus: #3aa6c4;
  --ok: #17733f; --ok-bg: #e5f4eb; --ok-line: #bfe2cc; --ok-bar: #2f9e5b;
  --warn: #9a5800; --warn-bg: #fff2da; --warn-line: #f1d39a; --warn-bar: #e59400;
  --bad: #b9302a; --bad-bg: #fdeceb; --bad-line: #f4c2bf; --bad-bar: #dd3b31;
  --info: #22579f; --info-bg: #e8eff9; --info-line: #c4d5ee;
  --abs: #75389a; --abs-bg: #f4ebf9; --abs-line: #e0c8ee;
  --neutral-bar: #b6c1cc;
  --chip-line: rgba(15, 30, 50, .28);
  --sh-1: 0 1px 2px rgba(14, 30, 48, .05), 0 1px 3px rgba(14, 30, 48, .04);
  --sh-2: 0 10px 30px -12px rgba(14, 30, 48, .28), 0 2px 6px rgba(14, 30, 48, .06);
  --r-lg: 16px; --r: 12px; --r-sm: 9px;
  --tv-bg: #08131d; --tv-card: #102233; --tv-line: rgba(255, 255, 255, .1); --tv-ink: #eef4f8; --tv-muted: #a3b5c6; --tv-time: #8fd6ea;
  --font-body: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-display: "Archivo", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1016; --surface: #111920; --surface-2: #151f28; --sunken: #0d141b; --line: #212d38; --line-2: #2f3e4b;
    --ink: #e6edf3; --ink-2: #b9c5d0; --muted: #8696a6;
    --brand: #0e2a42; --brand-ink: #ffffff;
    --accent: #45c0dc; --accent-strong: #79d4e8; --accent-soft: #0f2b34; --accent-ink: #04161c; --focus: #63cde4;
    --ok: #6bd394; --ok-bg: #10291b; --ok-line: #1f4d33; --ok-bar: #3fbf72;
    --warn: #f2bc5a; --warn-bg: #2f220b; --warn-line: #5c4314; --warn-bar: #f0a426;
    --bad: #ff8f86; --bad-bg: #331513; --bad-line: #632722; --bad-bar: #f0574c;
    --info: #92bff2; --info-bg: #122339; --info-line: #24436a;
    --abs: #d9aaf0; --abs-bg: #2a1935; --abs-line: #4b2f5d;
    --neutral-bar: #43515e;
    --chip-line: rgba(0, 0, 0, .5);
    --sh-1: 0 1px 2px rgba(0, 0, 0, .35); --sh-2: 0 12px 32px -10px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1016; --surface: #111920; --surface-2: #151f28; --sunken: #0d141b; --line: #212d38; --line-2: #2f3e4b;
  --ink: #e6edf3; --ink-2: #b9c5d0; --muted: #8696a6;
  --brand: #0e2a42; --brand-ink: #ffffff;
  --accent: #45c0dc; --accent-strong: #79d4e8; --accent-soft: #0f2b34; --accent-ink: #04161c; --focus: #63cde4;
  --ok: #6bd394; --ok-bg: #10291b; --ok-line: #1f4d33; --ok-bar: #3fbf72;
  --warn: #f2bc5a; --warn-bg: #2f220b; --warn-line: #5c4314; --warn-bar: #f0a426;
  --bad: #ff8f86; --bad-bg: #331513; --bad-line: #632722; --bad-bar: #f0574c;
  --info: #92bff2; --info-bg: #122339; --info-line: #24436a;
  --abs: #d9aaf0; --abs-bg: #2a1935; --abs-line: #4b2f5d;
  --neutral-bar: #43515e;
  --chip-line: rgba(0, 0, 0, .5);
  --sh-1: 0 1px 2px rgba(0, 0, 0, .35); --sh-2: 0 12px 32px -10px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.wrap { padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.ico { width: 1em; height: 1em; flex: none; vertical-align: -.125em; }
.cond { font-stretch: 78%; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; white-space: nowrap;
  font-weight: 550; font-size: 14px; transition: background .15s, border-color .15s, box-shadow .15s; }
.btn:hover { background: var(--surface-2); border-color: var(--muted); }
.btn:focus-visible, .chip:focus-visible, .linkish:focus-visible, .tab:focus-visible, .date-btn:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn-danger { background: var(--bad-bar); border-color: var(--bad-bar); color: #fff; }
.btn-ok { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); font-weight: 650; }
.btn-small { min-height: 32px; padding: 0 11px; font-size: 13px; }
.btn-icon { width: 38px; padding: 0; font-size: 18px; }

/* Cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 11px; }
.mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: var(--brand-ink);
  font: 800 16px/1 var(--font-display); font-stretch: 80%; letter-spacing: .02em; box-shadow: inset 0 -3px 0 rgba(69, 192, 220, .55); }
.brand-name { font: 750 16px/1.1 var(--font-display); letter-spacing: -.005em; }
.brand-name small { display: block; font: 500 12.5px/1.25 var(--font-body); color: var(--muted); letter-spacing: 0; }
.datenav { display: flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.datenav .btn { border-color: transparent; background: transparent; min-height: 36px; }
.datenav .btn:hover { background: var(--surface); border-color: var(--line); }
.datenav #today { font-weight: 650; color: var(--accent); }
.datenav #today:disabled { color: var(--muted); }
.date-btn { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border-radius: 9px; cursor: pointer;
  font: 750 19px/1 var(--font-display); font-stretch: 82%; letter-spacing: -.005em; color: var(--ink); white-space: nowrap; }
.date-btn:hover { background: var(--surface); }
.date-btn .ico { color: var(--muted); font-size: 16px; }
.date-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.sync { display: flex; align-items: center; gap: 8px; margin-left: auto; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-bar); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok-bar) 22%, transparent); }
.dot.err { background: var(--bad-bar); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad-bar) 22%, transparent); }
.dot.busy { background: var(--warn-bar); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn-bar) 22%, transparent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.sync .btn { border-color: var(--line); }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: var(--sunken); border: 1px solid var(--line); }
.tab { border: 0; background: transparent; color: var(--ink-2); padding: 0 14px; min-height: 34px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 14px; }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--sh-1), 0 0 0 1px var(--line); }

/* Avisos */
.notices { display: grid; gap: 8px; padding-block: 14px 0; }
.notices:empty { display: none; }
.notice { padding: 11px 14px; border-radius: var(--r); border: 1px solid; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
.notice.bad { background: var(--bad-bg); border-color: var(--bad-line); color: var(--ink); }
.notice.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--ink); }
.notice.info { background: var(--info-bg); border-color: var(--info-line); color: var(--ink); }
.notice strong { font-weight: 700; }

/* Vistas */
.view { display: none; }
body[data-view="board"] #v-board { display: grid; }
body[data-view="tv"] #v-tv { display: flex; }
body[data-view="settings"] #v-settings { display: block; }
body.ro .ed { display: none !important; }

/* Tablero */
#v-board { grid-template-columns: 296px minmax(0, 1fr); gap: 20px; padding-block: 20px 48px; align-items: start; }
.panel { position: sticky; top: 82px; max-height: calc(100dvh - 100px); overflow: auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-1); scrollbar-width: thin; }
.panel section + section { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.panel h3 { display: flex; align-items: baseline; justify-content: space-between; font: 650 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 10px; }
.panel .hint { margin: 0 0 14px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.panel section .hint { margin: 0; }
.sheet-btn { display: none; }
.drop-out { display: none; }
body.dragging .panel .drop-out { display: block; position: sticky; bottom: 0; margin-top: 12px; padding: 14px; text-align: center; border: 2px dashed var(--bad-bar);
  border-radius: var(--r); background: var(--bad-bg); color: var(--bad); font-weight: 650; }
.panel.over .drop-out { background: var(--bad-bar); color: #fff; }
.legend { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.legend summary { cursor: pointer; color: var(--muted); font-weight: 600; }
.legend ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--chip-line); vertical-align: -2px; margin-right: 8px; }
.sw.pend { border-style: dashed; }

/* Fichas: forma octogonal (técnicos) y hexagonal (furgonetas) como en el organigrama */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 2px;
  background: var(--cb); color: var(--cf); border: 1px solid var(--chip-line); font: 700 14px/1 var(--font-display); font-stretch: 80%; letter-spacing: .03em;
  white-space: nowrap; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .08);
  clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  transition: transform .12s, filter .12s; }
.chip[data-drag] { cursor: grab; touch-action: manipulation; }

.chip.pend { border: 1.5px dashed #56677a; clip-path: none; border-radius: 9px; box-shadow: none; }
.chip.sel { clip-path: none; border-radius: 9px; outline: 3px solid var(--accent); outline-offset: 2px; }
.chip.off { opacity: .45; }
.chip.abs { text-decoration: line-through; text-decoration-thickness: 2px; }
.chip.confl { box-shadow: inset 0 0 0 3px #c62828; }
.chip .flag { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: #15212d; color: #fff; font: 700 10.5px/1 var(--font-body); }
.chip .flag.w { background: #c62828; }
.chip .n { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: rgba(10, 20, 30, .78); color: #fff;
  font: 700 10.5px/1 var(--font-body); font-stretch: 100%; font-variant-numeric: tabular-nums; }
.chip .x { display: inline-grid; place-items: center; width: 24px; height: 24px; margin-right: -6px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(0, 0, 0, .12); color: inherit; font: 400 17px/1 var(--font-body); cursor: pointer; }
.chip .x:hover { background: rgba(0, 0, 0, .28); }
.chip.van { clip-path: polygon(12px 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 12px 100%, 0 50%); padding: 0 18px; border: 0; }
.chip.van.pend { clip-path: none; border: 1.5px dashed #56677a; }
.chip .model { font-stretch: 80%; }
.chip .plate { font: 600 12.5px/1 var(--font-mono); letter-spacing: .02em; padding: 3px 5px; border-radius: 4px; background: rgba(255, 255, 255, .55); }
.chip .typ { font: 600 10px/1 var(--font-body); font-stretch: 100%; text-transform: uppercase; opacity: .72; letter-spacing: .05em; }
.chip.big { min-height: 46px; font-size: 21px; padding: 0 16px; }
.chip.big .plate { font-size: 17px; padding: 4px 7px; }
.chip.van.big { padding: 0 24px; }
.ghost { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; clip-path: none !important; border-radius: 9px; box-shadow: 0 16px 34px rgba(0, 0, 0, .3); }
.src { opacity: .35; }
body.dragging, body.dragging * { cursor: grabbing !important; }

/* Resumen y trabajos */
.jobs { min-width: 0; display: grid; gap: 14px; align-content: start; }
.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; box-shadow: var(--sh-1); }
.pill b { font: 750 18px/1 var(--font-display); font-stretch: 85%; color: var(--ink); }
.pill.zero { opacity: .55; box-shadow: none; }
.pill.st-un:not(.zero) b { color: var(--ink); }
.pill.st-nd:not(.zero) { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); } .pill.st-nd:not(.zero) b { color: var(--warn); }
.pill.st-cf:not(.zero) { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); } .pill.st-cf:not(.zero) b { color: var(--bad); }
.pill.st-ok:not(.zero) { background: var(--info-bg); border-color: var(--info-line); color: var(--info); } .pill.st-ok:not(.zero) b { color: var(--info); }
.sumrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.internal { margin: -2px 0 0; font-size: 13px; color: var(--muted); }
.sec { display: flex; align-items: center; gap: 10px; font: 650 12px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 12px 0 0; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
.empty { padding: 44px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-lg); }

.job { display: flex; flex-direction: column; gap: 12px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 16px 16px 14px 20px; box-shadow: var(--sh-1); position: relative; transition: box-shadow .15s, border-color .15s; }
.job::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 4px; border-radius: 0 4px 4px 0; background: var(--neutral-bar); }
.job.s-sin-conductor::before { background: var(--warn-bar); }
.job.s-asignado::before { background: var(--ok-bar); }
.job.s-conflicto::before { background: var(--bad-bar); }
.job.done { border-color: var(--ok-line); }
.job.over { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent), var(--sh-2); }
.job.over.warn { border-color: var(--bad-bar); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad-bar) 35%, transparent), var(--sh-2); }
.job-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.time { display: inline-flex; align-items: baseline; gap: 8px; font: 750 26px/1 var(--font-display); font-stretch: 78%; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.time .dur { font: 500 12px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.job h4 { margin: -4px 0 0; font: 600 15.5px/1.35 var(--font-body); overflow-wrap: anywhere; text-wrap: pretty; }
.linkish { all: unset; cursor: pointer; }
@media (hover: hover) { .linkish:hover, a.loc:hover { color: var(--accent); } .chip[role="button"]:hover { filter: brightness(.95); transform: translateY(-1px); } }
.loc { display: inline-flex; align-items: flex-start; gap: 6px; font-weight: 500; font-size: 14px; color: var(--ink-2); text-decoration: none; overflow-wrap: anywhere; margin-top: -4px; }
.loc .ico { color: var(--accent); margin-top: .18em; }
.loc.none { color: var(--muted); font-style: italic; }
.slot { background: var(--sunken); border: 1px dashed var(--line-2); border-radius: var(--r); padding: 10px; transition: background .15s; }
.slot:has(.chip) { background: var(--surface-2); border-style: solid; border-color: var(--line); }
.slot-l { display: block; font: 650 11px/1 var(--font-body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.slot-l .w { color: var(--warn); text-transform: none; letter-spacing: 0; font: 600 12px/1 var(--font-body); }
.drop-hint { font-size: 13px; color: var(--muted); min-height: 32px; display: inline-flex; align-items: center; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.b { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 650; border: 1px solid; letter-spacing: .01em; }
.b::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-sin-asignar { background: var(--surface-2); border-color: var(--line-2); color: var(--ink-2); }
.b-sin-conductor { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn); }
.b-asignado { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.b-conflicto { background: var(--bad-bg); border-color: var(--bad-line); color: var(--bad); }
.b-ausencia { background: var(--abs-bg); border-color: var(--abs-line); color: var(--abs); }
.b-completo { background: var(--info-bg); border-color: var(--info-line); color: var(--info); }
.confl { margin: 0; padding: 10px 12px 10px 28px; background: var(--bad-bg); border: 1px solid var(--bad-line); border-radius: var(--r); font-size: 13px; color: var(--ink); }
.fields { display: grid; gap: 6px; }
.fields .slot-l { margin: 6px 0 0; }
.fields .f-row:first-child .slot-l { margin-top: 0; }
.fields input, .fields textarea { width: 100%; min-height: 40px; padding: 9px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink);
  font: 400 15px/1.4 var(--font-body); transition: border-color .15s, box-shadow .15s; }
.fields input::placeholder, .fields textarea::placeholder { color: var(--muted); opacity: .8; }
.fields textarea { resize: vertical; min-height: 64px; overflow: hidden; }
.fields input:focus, .fields textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.f-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; }
.f-row .slot-l { margin-bottom: 0; }
.f-state { font-size: 12px; color: var(--muted); min-height: 1em; }
.f-sug { font-size: 12.5px; }

// ===== Arrastrar y soltar (ratón y táctil) =====
(function dnd() {
  let pend = null, drag = null, suppress = false, scrollT = null;
  function start() {
    const { el, data } = pend; clearTimeout(pend.timer);
    const x = pend.x, y = pend.y; pend = null;
    const r = el.getBoundingClientRect();
    const g = el.cloneNode(true); g.classList.add('ghost'); g.style.setProperty('width', r.width + 'px');
    document.body.append(g);
    drag = { data, g, el, t: null, ox: Math.min(r.width / 2, 60), oy: r.height / 2 };
    el.classList.add('src'); document.body.classList.add('dragging'); document.body.classList.remove('sheet');
    navigator.vibrate?.(15);
    move(x, y);
  }
  function move(x, y) {
    drag.g.style.setProperty('transform', `translate(${x - drag.ox}px, ${y - drag.oy}px)`);
    const t = document.elementFromPoint(x, y)?.closest('[data-drop-event], [data-drop-out]') || null;
    if (t !== drag.t) {
      drag.t?.classList.remove('over', 'warn');
      drag.t = t;
      if (t) {
        t.classList.add('over');
        if (t.dataset.dropEvent && conflictsFor(drag.data.type, drag.data.id, t.dataset.dropEvent, S.day.events, S.plans).length) t.classList.add('warn');
      }
    }
    clearInterval(scrollT);
    const dy = y < 70 ? -12 : y > innerHeight - 70 ? 12 : 0;
    if (dy) scrollT = setInterval(() => scrollBy(0, dy), 16);
  }
  function end(cancel) {
    clearInterval(scrollT);
    if (!drag) return;
    const { data, t, g, el } = drag; drag = null;
    g.remove(); el.classList.remove('src'); t?.classList.remove('over', 'warn'); document.body.classList.remove('dragging');
    suppress = true; setTimeout(() => (suppress = false), 60);
    if (cancel || !t) return;
    if (t.dataset.dropOut != null) { if (data.from) unassign(data.type, data.id, data.from); }
    else assign(data.type, data.id, t.dataset.dropEvent, data.from);
  }
  document.addEventListener('pointerdown', (e) => {
    if (!editable() || S.view !== 'board' || e.button > 0) return;
    if (e.target.closest('.x, [data-nodrag]')) return;
    const el = e.target.closest('[data-drag]'); if (!el) return;
    pend = { el, data: { type: el.dataset.drag, id: Number(el.dataset.id), from: el.dataset.from || '' }, x: e.clientX, y: e.clientY, pid: e.pointerId, touch: e.pointerType === 'touch' };
    if (pend.touch) pend.timer = setTimeout(() => pend && start(), 250);
  });
  document.addEventListener('pointermove', (e) => {
    if (drag) { e.preventDefault(); move(e.clientX, e.clientY); return; }
    if (!pend || e.pointerId !== pend.pid) return;
    const dist = Math.hypot(e.clientX - pend.x, e.clientY - pend.y);
    if (pend.touch) { if (dist > 10) { clearTimeout(pend.timer); pend = null; } }
    else if (dist > 5) { pend.x = e.clientX; pend.y = e.clientY; start(); }
  }, { passive: false });
  document.addEventListener('pointerup', () => { if (pend) { clearTimeout(pend.timer); pend = null; } if (drag) end(false); });
  document.addEventListener('pointercancel', () => { if (pend) { clearTimeout(pend.timer); pend = null; } if (drag) end(true); });
  document.addEventListener('touchmove', (e) => { if (drag) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-drag]')) e.preventDefault(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (drag) end(true); else if (S.selected) { S.selected = null; render(); } } });

      const x = snap.exists ? snap.data() : null;
      if (x) {
        S.res = { profiles: x.profiles || [], techs: (x.techs || []).map((t) => ({ ...t, id: Number(t.id) })), vanTypes: x.vanTypes || [], vans: (x.vans || []).map((v) => ({ ...v, id: Number(v.id) })) };
        S.resLoaded = true;
      }
      computeDay(); renderSoon();
    }, () => {});
    watchPlans();
  }
  render();
  loadDay();
})();
})();
</script>
