<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3d6b">
  <title>Acceso · Planificación Delaire 2000</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <div class="brand"><span class="logo" aria-hidden="true">D2</span><span class="brand-text">Delaire 2000 <small>Planificación de técnicos</small></span></div>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <p id="login-error" class="error-text" role="alert"></p>
  </form>
</body>
</html>
